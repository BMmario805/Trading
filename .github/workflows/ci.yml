name: Software checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Python 3.13 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      TRADING_MT5_ENABLED: "0"
      TRADING_KEEP_AWAKE: "0"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.lock
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run backend and recovery tests
        run: python -m pytest tests -q

  panel:
    name: Panel Node 24
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked panel dependencies
        run: npm ci
      - name: Build panel
        run: npm run build
      - name: Check panel source
        run: npm run lint
